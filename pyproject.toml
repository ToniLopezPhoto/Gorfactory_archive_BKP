[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gorbackup"
version = "0.1.0"
description = "Safe, configurable archive backup tooling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
gorbackup = "gorbackup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
