source:
  path: /Volumes/SOURCE/catalogue
  mount_path: /Volumes/SOURCE
  marker_file: .gorbackup-source
  marker_id: gorfactory-sam

archive:
  root: /Volumes/ARCHIVE
  current_dir: current
  history_dir: history
  marker_file: .gorbackup-archive
  marker_id: gorfactory-archive-primary

safety:
  max_deletes_per_run: 500
  max_delete_size_gb: 50
  min_free_space_percent: 15
  ignore_recent_minutes: 15
  min_source_size_gb: 3500
  min_source_size_ratio: 0.8
  # Compared with latest known-good; baseline is used only before the first success.
  max_source_file_count_drop: 500
  max_source_file_count_drop_percent: 10
  max_source_bytes_drop_gb: 50
  max_source_bytes_drop_percent: 10
  # Count includes new, modified, and rename/move candidates.
  max_changed_files_per_run: 2000
  max_changed_bytes_gb: 200
  max_changed_catalogue_percent: 25

retention:
  auto_prune: false

rename_optimization:
  enabled: true
  require_hash: true

logging:
  level: INFO
  directory: logs
  keep_days: 30

state:
  directory: state
  manifests_dir: manifests
  ledger_file: gorbackup.sqlite3
  baseline_manifest: baseline.json
  baseline_report: baseline-report.json
